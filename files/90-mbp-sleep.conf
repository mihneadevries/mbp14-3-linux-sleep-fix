[Sleep]
# S3 ("deep") resume fails in amdgpu on the Radeon Pro 555/560 (SMU load
# firmware failed, -22). s2idle works together with the 90-mbp-sleep hook.
MemorySleepMode=s2idle
# Hibernate restore hits the same amdgpu failure and crashes the session.
# Re-enable once your kernel has "drm/amdgpu: reset VI ASIC on Apple boards
# with VRAM at 0".
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
